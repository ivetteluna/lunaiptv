name: Build Visor Camaras UNV Android TV APK

on:
  push:
    branches: [ "visor-camaras-tv" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VisorCamarasUNV-TV-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisorCamarasUNV-TV-v1.0
          path: VisorCamarasUNV-TV-v1.0.apk
          if-no-files-found: error
